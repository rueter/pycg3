[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycg3"
version = "0.2.0"
description = "Pure Python VISL CG-3 (Constraint Grammar 3): hfst analyses in, disambiguated and mapped readings out"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "GrammarSoft ApS / VISL CG-3 Contributors" },
    { name = "pycg3 contributors" }
]
keywords = ["nlp", "linguistics", "constraint-grammar", "cg3", "vislcg3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/rueter/pycg3"
Issues = "https://github.com/rueter/pycg3/issues"

[project.optional-dependencies]
hfst = ["pyhfst>=1.3.0"]

[project.scripts]
pycg3 = "pycg3.cli:main"
vislcg3-py = "pycg3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycg3*"]
